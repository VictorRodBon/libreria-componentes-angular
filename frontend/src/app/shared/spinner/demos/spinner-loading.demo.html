<div class="demo">
  <div class="stage">
    <app-spinner [size]="size()" [color]="color()"></app-spinner>
  </div>

  <div class="controls">
    <label>
      Tamaño:
      <select (change)="size.set(asSize($any($event.target).value))">
        @for (t of tamanos; track t) {
          <option [value]="t" [selected]="t === size()">{{ t }}</option>
        }
      </select>
    </label>

    <label>
      Color:
      <select (change)="color.set(asColor($any($event.target).value))">
        @for (c of colores; track c) {
          <option [value]="c" [selected]="c === color()">{{ c }}</option>
        }
      </select>
    </label>
  </div>
</div>
