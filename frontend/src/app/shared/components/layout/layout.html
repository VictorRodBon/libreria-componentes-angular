<div class="layout">
  <aside class="sidebar">
    <h2>Categorías</h2>

    <nav>
      <a
        routerLink="/categoria"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="activo"
      >
        Todos
      </a>

      @for (cat of categorias(); track cat.slug) {
        <a
          [routerLink]="['/categoria', cat.slug]"
          routerLinkActive="activo"
        >
          {{ cat.nombre }}
        </a>
      }
      @if (auth.usuario(); as usuario) {
        <a
          routerLink="/favoritos"
          routerLinkActive="activo"
        >
          Favoritos
        </a>
      }
    </nav>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
